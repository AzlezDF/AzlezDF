<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Daffi Al Hammani — Cyber Security Enthusiast</title>
  <desc id="desc">Banner teknologi futuristik yang halus dengan jaringan abstrak, perisai keamanan, dan aksen biru, cyan, serta violet.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071D33"/>
      <stop offset="55%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="74%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".32"/>
      <stop offset="56%" stop-color="#2563EB" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#0A2540" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
