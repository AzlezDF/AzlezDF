  <rect width="1280" height="360" rx="18" fill="url(#cyanGlow)"/>
  <circle cx="1034" cy="80" r="98" fill="#2563EB" fill-opacity=".16" filter="url(#blur)"/>
  <circle cx="1130" cy="270" r="80" fill="#8B5CF6" fill-opacity=".12" filter="url(#blur)"/>

